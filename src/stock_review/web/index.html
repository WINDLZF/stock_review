<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A股复盘总结</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1f2329; --sub:#6b7280; --line:#eceef1;
    --navy:#1f2a44; --navy2:#2c3e5c; --gold:#c8a45c;
    --up:#e23a3a; --down:#1a9e5a; --flat:#8a8f99;
    --chip:#f1f3f6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px;line-height:1.6;}
  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
    padding:18px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  .brand{font-size:20px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(200,164,92,.25)}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .controls label{font-size:13px;color:#d7dce6;display:flex;flex-direction:column;gap:4px}
  .controls input,.controls select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid #3a4a66;background:#fff;color:var(--ink);min-width:150px}
  .controls button{margin-top:18px;padding:9px 20px;border:0;border-radius:8px;cursor:pointer;
    background:var(--gold);color:#1f2329;font-weight:700;font-size:14px;transition:.15s}
  .controls button:hover{filter:brightness(1.06)}
  .controls button:disabled{opacity:.6;cursor:default}
  main{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .banner{background:#fff7e6;border:1px solid #ffe1a8;color:#8a5a00;padding:10px 14px;border-radius:10px;margin-bottom:18px;font-size:13px}
  .overview{background:var(--card);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line)}
  .ov-row{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  .ov-date{font-size:26px;font-weight:800}
  .ov-time{color:var(--sub);font-size:13px}
  .ov-summary{margin-top:14px;padding:12px 14px;border-left:4px solid var(--gold);background:#fbf7ec;border-radius:0 10px 10px 0;color:#5a4a22;font-size:14px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .chip{background:var(--chip);border-radius:10px;padding:10px 14px;min-width:96px}
  .chip .k{color:var(--sub);font-size:12px}
  .chip .v{font-size:20px;font-weight:800;margin-top:2px}
  .dim{background:var(--card);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line)}
  .dim-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .dim-idx{background:var(--navy);color:#fff;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .dim-title{font-size:17px;font-weight:700}
  .dim-summary{margin:8px 0 14px;padding:10px 12px;border-left:4px solid var(--gold);background:#fbf7ec;border-radius:0 8px 8px 0;color:#5a4a22}
  .tbl-title{font-size:13px;color:var(--sub);margin:10px 0 6px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#fafbfc;color:var(--sub);font-weight:600;position:sticky;top:0}
  tbody tr:hover{background:#fafcff}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .up{color:var(--up);font-weight:600}
  .down{color:var(--down);font-weight:600}
  .flat{color:var(--flat)}
  .bar{display:inline-block;height:8px;border-radius:4px;background:linear-gradient(90deg,#d9b977,#c8a45c);vertical-align:middle;margin-left:8px}
  .status{padding:30px;text-align:center;color:var(--sub)}
  .err{background:#fff1f0;border:1px solid #ffccc7;color:#a8071a;padding:14px 16px;border-radius:10px}
  .hidden{display:none}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>A股复盘总结</div>
    <div class="controls">
      <label>交易日<input type="date" id="dt" /></label>
      <label>股票池<select id="group"><option>加载中…</option></select></label>
      <button id="go">生成复盘</button>
    </div>
  </header>

  <main>
    <div class="banner">演示数据：合成行情 + 「演示池」分组，仅用于预览复盘报告的结构与形态。接真实数据源（通达信 vipdoc / akshare）后即为日常复盘产出。</div>
    <div id="status" class="status">正在加载…</div>
    <section id="overview" class="overview hidden"></section>
    <div id="report"></div>
    <div class="foot">数据来源 /api/review · 维度由 config.yaml 驱动、注册表自动发现</div>
  </main>

<script>
const $ = (s) => document.querySelector(s);

function today(){ return new Date().toISOString().slice(0,10); }
function pctClass(v){ if(v>0) return 'up'; if(v<0) return 'down'; return 'flat'; }
function isNum(x){ return typeof x==='number' && isFinite(x); }
function fmt(v){
  if(v===null||v===undefined||v==='') return '—';
  if(typeof v==='number'){
    if(Math.abs(v)>=1000) return v.toLocaleString('zh-CN');
    return (Math.round(v*100)/100).toString();
  }
  return v;
}

// 根据列名与值决定单元格着色
function cellClass(col, v){
  if(!isNum(v)) return '';
  if(col==='涨幅%'||col==='涨幅'||col==='change_pct') return pctClass(v);
  if(col==='rsi14'){ if(v>=70) return 'up'; if(v<=30) return 'down'; return ''; }
  if(col==='macd'){ return v>0?'up':'down'; }
  return '';
}

async function loadGroups(){
  try{
    const r = await fetch('/api/watchlists');
    const groups = await r.json();
    const sel = $('#group');
    sel.innerHTML = '';
    if(!groups.length){
      sel.innerHTML = '<option value="">（无分组）</option>';
      return;
    }
    for(const g of groups){
      const o = document.createElement('option');
      o.value = g.name; o.textContent = `${g.name}（${g.size}只）`;
      sel.appendChild(o);
    }
    // 默认选中演示池
    const demo = groups.find(g=>g.name==='演示池');
    if(demo) sel.value = '演示池';
  }catch(e){
    $('#group').innerHTML = '<option>加载失败</option>';
  }
}

function renderOverview(report){
  const ov = $('#overview');
  const breadth = report.dimensions.find(d=>d.key==='breadth');
  const tech = report.dimensions.find(d=>d.key==='technical');
  const chips = [];
  if(breadth && breadth.data){
    chips.push(['涨停家数', breadth.data.limit_up ?? '—']);
    chips.push(['最高连板', breadth.data.max_board ?? '—']);
  }
  if(tech && tech.data) chips.push(['技术样本', tech.data.count ?? '—']);
  chips.push(['维度', report.dimensions.length]);

  const genAt = report.generated_at ? new Date(report.generated_at).toLocaleString('zh-CN') : '—';
  const summary = breadth ? breadth.summary : (report.dimensions[0]?.summary || '');
  ov.innerHTML = `
    <div class="ov-row">
      <div class="ov-date">${report.trade_date}</div>
      <div class="ov-time">生成于 ${genAt}</div>
    </div>
    ${summary ? `<div class="ov-summary">${summary}</div>` : ''}
    <div class="chips">
      ${chips.map(c=>`<div class="chip"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('')}
    </div>`;
  ov.classList.remove('hidden');
}

function renderTable(tbl){
  const cols = tbl.columns || [];
  const rows = tbl.rows || [];
  let h = `<div class="tbl-title">${tbl.title||''}</div>`;
  h += '<div style="overflow:auto"><table><thead><tr>' +
       cols.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>';
  for(const row of rows){
    h += '<tr>';
    for(const c of cols){
      const v = row[c];
      const cls = cellClass(c, v);
      const numCls = isNum(v) ? 'num' : '';
      const bar = (c==='家数' && isNum(v)) ? `<span class="bar" style="width:${Math.min(v,12)*8}px"></span>` : '';
      h += `<td class="${[cls,numCls].filter(Boolean).join(' ')}">${fmt(v)}${bar}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  return h;
}

function renderReport(report){
  const box = $('#report');
  box.innerHTML = '';
  report.dimensions.forEach((dim,i)=>{
    const tables = (dim.tables||[]).map(renderTable).join('');
    const div = document.createElement('section');
    div.className = 'dim';
    div.innerHTML = `
      <div class="dim-head">
        <div class="dim-idx">${i+1}</div>
        <div class="dim-title">${dim.title||dim.key}</div>
      </div>
      ${dim.summary ? `<div class="dim-summary">${dim.summary}</div>` : ''}
      ${tables || '<div class="tbl-title">（本维度暂无结构化数据）</div>'}`;
    box.appendChild(div);
  });
}

async function run(){
  const dt = $('#dt').value || today();
  const grp = $('#group').value;
  const btn = $('#go');
  $('#status').textContent = '正在生成复盘…';
  $('#status').classList.remove('hidden');
  $('#overview').classList.add('hidden');
  $('#report').innerHTML = '';
  btn.disabled = true;
  try{
    const url = `/api/review?trade_date=${encodeURIComponent(dt)}` +
                (grp ? `&group=${encodeURIComponent(grp)}` : '');
    const r = await fetch(url);
    if(!r.ok){
      const msg = await r.text();
      throw new Error(msg || ('HTTP '+r.status));
    }
    const report = await r.json();
    $('#status').classList.add('hidden');
    renderOverview(report);
    renderReport(report);
  }catch(e){
    $('#status').className = 'status';
    $('#status').innerHTML = `<div class="err">复盘生成失败：${e.message}` +
      `<br/>若提示分组不存在，请先运行 <code>python scripts/seed_demo_tdx.py</code> 生成「演示池」。</div>`;
  }finally{
    btn.disabled = false;
  }
}

$('#dt').value = today();
$('#go').addEventListener('click', run);
loadGroups().then(()=>{ /* 自动生成一次 */ run(); });
</script>
</body>
</html>
